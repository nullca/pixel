name: test-and-deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: tools
      - run: npm run smoke
        working-directory: tools
  deploy:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # unique name per attempt: re-running a run keeps the old artifact,
      # and deploy-pages fails if two artifacts share a name
      - uses: actions/upload-pages-artifact@v3
        with: { path: game, name: "github-pages-${{ github.run_attempt }}" }
      - id: d
        uses: actions/deploy-pages@v4
        with: { artifact_name: "github-pages-${{ github.run_attempt }}" }
